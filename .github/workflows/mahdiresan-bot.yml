name: mahdiresan-bot
on:
  workflow_dispatch:
    inputs:
      state_b64:
        description: "base64(tar.gz) state — از اجرای قبلی"
        required: false
        default: ""
  schedule:
    - cron: "23 */12 * * *"   # نجات: اگر زنجیره قطع شده باشد، هر ۱۲ ساعت ربات را برمی‌گرداند
concurrency:
  group: mahdiresan-run
  cancel-in-progress: false
permissions:
  contents: read
  actions: write
jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install "python-telegram-bot~=21.11"

      - name: Skip redundant scheduled run (chain is healthy)
        if: inputs.state_b64 == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          A=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=botstate&per_page=1")
          AGE_H=$(( ($(date +%s) - $(echo "$A" | jq -r '.artifacts[0].created_at // empty' | xargs -r date -d - +%s 2>/dev/null || echo 0)) / 3600 ))
          if [ "$(echo "$A" | jq -r '.total_count // 0')" -gt 0 ] && [ "$AGE_H" -lt 7 ]; then
            echo "chain is healthy (artifact ${AGE_H}h old) — cancelling this redundant run"
            gh run cancel "${{ github.run_id }}" --repo "${GITHUB_REPOSITORY}" || true
            sleep 30
          fi

      - name: Find previous state artifact
        if: inputs.state_b64 == ''
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RID=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=botstate&per_page=1" \
            | jq -r '.artifacts[0].run_id // empty')
          echo "run_id=$RID" >> "$GITHUB_OUTPUT"

      - name: Restore state (dispatch input → artifact → fresh)
        env:
          STATE_B64: ${{ inputs.state_b64 }}
          GH_TOKEN: ${{ github.token }}
          PREV_RUN: ${{ steps.find.outputs.run_id }}
        run: |
          if [ -n "$STATE_B64" ]; then
            echo "$STATE_B64" | base64 -d > state.tgz
            echo "✅ state از اجرای قبلی (dispatch chain) بازیابی شد"
          elif [ -n "$PREV_RUN" ]; then
            AID=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=botstate&per_page=1" \
              | jq -r '.artifacts[0].id')
            curl -sL -H "Authorization: Bearer $GH_TOKEN" -o a.zip \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/$AID/zip"
            unzip -o -q a.zip -d restored
            mv restored/state.tgz state.tgz 2>/dev/null || true
            rm -rf restored a.zip
            echo "✅ state از artifact پشتیبان بازیابی شد"
          else
            echo "⚠️ state قبلی پیدا نشد — شروع با دیتای خالی"
          fi
          if [ -f state.tgz ]; then
            tar xzf state.tgz && rm -f state.tgz
            echo "state restored:"
            ls -la
          fi
          if [ ! -f config.json ]; then
            echo "❌ config.json بعد از restore پیدا نشد — fail fast تا لاگ‌ها دیده شود"
            exit 1
          fi

      - name: Self-test (fail fast with visible logs)
        run: |
          timeout 45 python -u bot.py > selftest.log 2>&1; RC=$?
          echo "─── خروجی بوت در self-test:"
          tail -n 25 selftest.log || true
          # ✅ معیار درست: «bot online» در لاگ = بوت سالم (PTB هنگام SIGTERM خروج تمیز rc=0 می‌دهد)
          if grep -q "bot online" selftest.log; then
            echo "✅ self-test OK — بوت آنلاین شد، حالا اجرای دائمی:"
          else
            echo "❌ SELF-TEST FAILED (rc=$RC) — «bot online» دیده نشد"
            exit 1
          fi
          sleep 3

      - name: Run bot (24/7 keep-alive loop)
        run: |
          DEADLINE=$((SECONDS + 19200))
          tail -f bot.log &
          TAIL_PID=$!
          while [ $SECONDS -lt $DEADLINE ]; do
            python bot.py >> run.log 2>&1 || true
            echo "$(date -u '+%FT%TZ') bot exited — restart in 10s" >> run.log
            sleep 10
          done
          kill $TAIL_PID 2>/dev/null || true
          echo "=== آخر bot.log ==="
          tail -n 40 bot.log || true
          echo "clean deadline exit — passing state to next run"

      - name: Save state artifact (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: botstate
          retention-days: 1
          if-no-files-found: ignore
          path: |
            config.json
            data.json
            instances/*/config.json
            instances/*/data.json

      - name: Start next run with current state (24/7 chain)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar czf state.tgz config.json data.json instances/*/config.json instances/*/data.json 2>/dev/null \
            || tar czf state.tgz config.json data.json
          B64=$(base64 -w0 state.tgz)
          jq -n --arg s "$B64" '{"ref":"main","inputs":{"state_b64":$s}}' > payload.json
          CODE=$(curl -s -o /tmp/resp.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/mahdiresan-bot.yml/dispatches" \
            --data @payload.json)
          echo "dispatch next run: HTTP $CODE"
          rm -f state.tgz payload.json
